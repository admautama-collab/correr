<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E8561E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Volver a Correr</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen phone app, bottom tab bar, big tabular numerals; walk=teal, run=coral, strength=violet */
:root{
  --bg:#EEF2F6; --card:#FFFFFF; --fg:#0E1726; --muted:#5B6B7F; --line:#D5DCE5;
  --accent:#E8561E; --accent-fg:#FFFFFF;
  --walk:#1C8C86; --run:#E8561E; --fuerza:#6B4FBB; --rest:#8E9AAB;
  --ok:#1F8A4C; --warn:#C27C0E; --bad:#C0392B;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(14,23,38,.08),0 6px 20px rgba(14,23,38,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1420; --card:#161D2B; --fg:#EDF1F6; --muted:#94A1B4; --line:#2A3446;
  --accent:#FF7A3D; --walk:#3CC2BA; --run:#FF7A3D; --fuerza:#9F86F0; --rest:#5F6C80;
  --ok:#3DBF75; --warn:#E3A33A; --bad:#E76058; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1420; --card:#161D2B; --fg:#EDF1F6; --muted:#94A1B4; --line:#2A3446;
  --accent:#FF7A3D; --walk:#3CC2BA; --run:#FF7A3D; --fuerza:#9F86F0; --rest:#5F6C80;
  --ok:#3DBF75; --warn:#E3A33A; --bad:#E76058; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:28px;font-weight:700;letter-spacing:.01em}
h2{font-size:22px;font-weight:600}
h3{font-size:17px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
main{flex:1;overflow-y:auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:14px 24px;min-width:0}
.view{display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto;width:100%}
.topbar{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;min-width:0}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:8px;font-weight:600;background:var(--card);border:1px solid var(--line);min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent;font-family:var(--display);font-size:20px;letter-spacing:.02em;text-transform:uppercase;padding:14px 20px}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#fff}
.pill.run{background:var(--run)}.pill.walk{background:var(--walk)}.pill.fuerza{background:var(--fuerza)}.pill.rest{background:var(--rest)}.pill.test{background:var(--muted)}
.pill.done{background:var(--ok)}
/* Segment bar */
.segbar{display:flex;height:14px;border-radius:4px;overflow:hidden;gap:2px}
.segbar i{display:block;height:100%}
.segbar i.walk{background:var(--walk)}.segbar i.run{background:var(--run)}.segbar i.cool{background:var(--walk);opacity:.6}.segbar i.mob{background:var(--fuerza)}
.phase.mob{background:var(--fuerza)}
.rout{display:flex;flex-direction:column;gap:6px}
.rout div{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:15px}
.rout div span:last-child{font-family:var(--display);font-weight:600;color:var(--muted)}
.seglist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.seglist li{display:grid;grid-template-columns:6px 70px 1fr;gap:10px;align-items:center}
.seglist li b{border-radius:3px;height:22px}
.seglist li b.walk{background:var(--walk)}.seglist li b.run{background:var(--run)}
/* Week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line);border-radius:8px;padding:8px 4px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);min-width:0}
.day.today{border-color:var(--fg);border-width:2px}
.day.sel{background:var(--fg);color:var(--bg)}
.day .dn{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.day.sel .dn{color:inherit;opacity:.75}
.day .dd{font-family:var(--display);font-size:20px;font-weight:600;line-height:1}
.dot{width:8px;height:8px;border-radius:50%;background:var(--rest)}
.dot.run{background:var(--run)}.dot.walk{background:var(--walk)}.dot.fuerza{background:var(--fuerza)}.dot.done{background:var(--ok)}
.day.off .dot{visibility:hidden}
/* Month grid */
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.month .mh{text-align:center;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:4px 0}
.mcell{aspect-ratio:1;max-width:100%;border-radius:6px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums;font-size:13px;background:var(--card)}
.mcell.out{opacity:.35}
.mcell.today{border-color:var(--fg);border-width:2px}
.mcell .dot{width:7px;height:7px}
/* Run screen */
.runscreen{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.phase{border-radius:var(--r);padding:18px 16px;color:#fff;text-align:center;display:flex;flex-direction:column;gap:4px}
.phase.walk{background:var(--walk)}.phase.run{background:var(--run)}.phase.cool{background:var(--walk)}.phase.done{background:var(--ok)}
.phase .lbl{font-size:14px;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.phase .big{font-family:var(--display);font-size:84px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.phase .nxt{font-size:14px;opacity:.9}
.anim{display:block;width:100%;max-width:300px;height:auto;margin:4px auto;background:var(--card);border-radius:8px}
.phase .how{font-size:16px;line-height:1.35;text-align:left;background:rgba(0,0,0,.18);border-radius:8px;padding:10px 12px;margin:6px 0 4px;text-wrap:pretty}
.phase.mob .big{font-size:64px}
.rout .how{grid-column:1/-1;font-size:13px;color:var(--muted);line-height:1.35;margin-top:-2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border-radius:8px;padding:10px 8px;text-align:center;box-shadow:var(--shadow)}
.stat .v{font-family:var(--display);font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.stat .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.stat.hot .v{color:var(--bad)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--fg);width:0%}
/* Forms */
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input[type=number],input[type=text],input[type=date],select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-height:44px}
textarea{min-height:70px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent)}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.painv{font-family:var(--display);font-size:40px;font-weight:700;line-height:1;min-width:48px;text-align:center}
/* History */
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hist li{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.hist li:last-child{border-bottom:0}
.hist .d{font-family:var(--display);font-size:15px;line-height:1.1;color:var(--muted);text-transform:uppercase}
.hist .d b{display:block;font-size:22px;color:var(--fg)}
.knee{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.knee.ok{color:var(--ok)}.knee.warn{color:var(--warn)}.knee.bad{color:var(--bad)}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-family:var(--body);font-size:11px}
svg.chart .grid{stroke:var(--line)}
/* Tabs */
nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
nav button[aria-current="page"]{color:var(--accent)}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.banner{border-left:4px solid var(--warn);background:var(--card);padding:10px 14px;border-radius:6px}
.banner.bad{border-color:var(--bad)}
.banner.ok{border-color:var(--ok)}
#pocket[hidden]{display:none!important}
#pocket{position:fixed;inset:0;background:#000;z-index:50;color:#444;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-family:var(--display);text-align:center;touch-action:none;user-select:none}
#pocket .t{font-size:72px;font-variant-numeric:tabular-nums;color:#666}
#pocket .l{font-size:18px;letter-spacing:.1em;text-transform:uppercase}
#pocket .x{font-size:14px;color:#333;margin-top:30px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;box-shadow:var(--shadow);z-index:20;max-width:90vw}
.ex{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.ex:last-child{border-bottom:0}
.ex .n{font-family:var(--display);font-size:18px;font-weight:600;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.progress i{transition:width .5s linear}}
</style>

// Progresión de trote: [repeticiones, segundos trote, segundos andar]

/* ===== Sincronización con GitHub (repositorio privado correr-datos) ===== */
const SYNC_REPO='admautama-collab/correr-datos',SYNC_FILE='estado.json';
let syncTimer=null,syncState={last:null,err:null,busy:false};
function scheduleSync(){if(!S.settings.ghToken||location.protocol==='file:')return;clearTimeout(syncTimer);syncTimer=setTimeout(syncUp,4000);}
function ghHeaders(){return {'Authorization':'Bearer '+S.settings.ghToken,'Accept':'application/vnd.github+json','Content-Type':'application/json'};}
async function ghGet(){const r=await fetch('https://api.github.com/repos/'+SYNC_REPO+'/contents/'+SYNC_FILE+'?t='+Date.now(),{headers:ghHeaders(),cache:'no-store'});if(r.status===404)return null;if(!r.ok)throw new Error('GitHub '+r.status);return r.json();}
function utf8b64(s){return btoa(unescape(encodeURIComponent(s)));}
function b64utf8(s){return decodeURIComponent(escape(atob(s.replace(/\n/g,''))));}
async function syncUp(){
  if(!S.settings.ghToken||syncState.busy)return;syncState.busy=true;syncState.err=null;
  try{
    const data=Object.assign({},S,{settings:Object.assign({},S.settings,{ghToken:undefined}),syncedAt:new Date().toISOString()});
    const cur=await ghGet();
    const body={message:'Registro '+new Date().toLocaleString('es-ES'),content:utf8b64(JSON.stringify(data,null,1))};if(cur&&cur.sha)body.sha=cur.sha;
    const r=await fetch('https://api.github.com/repos/'+SYNC_REPO+'/contents/'+SYNC_FILE,{method:'PUT',headers:ghHeaders(),body:JSON.stringify(body)});
    if(!r.ok)throw new Error('GitHub '+r.status);
    syncState.last=new Date();
  }catch(e){syncState.err=e.message||'error';}
  syncState.busy=false;const st=$('#syncst');if(st)st.textContent=syncText();
}

  catch(e){toast('No se pudo leer: '+(e.message||'error'));}

/* ============ DATES ============ */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromIso=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const todayIso=()=>iso(new Date());
function addDays(s,n){const d=fromIso(s);d.setDate(d.getDate()+n);return iso(d);}
function weekIndex(s){const a=fromIso(PLAN_START),b=fromIso(s);return Math.floor((b-a)/864e5/7);}
function mondayOf(s){const d=fromIso(s);const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);return iso(d);}
const fmtClock=t=>{t=Math.max(0,Math.round(t));return Math.floor(t/60)+':'+pad(t%60);};
const fmtMin=t=>{const m=Math.round(t/60);return m+'′';};
const fmtSeg=t=>t%60===0?fmtMin(t):Math.floor(t/60)+'′'+pad(t%60)+'″';
const fmtPace=p=>!p||!isFinite(p)||p>30?'–:––':Math.floor(p)+':'+pad(Math.round((p%1)*60));
const fmtDist=k=>(k||0).toFixed(2).replace('.',',');

/* ============ PLAN ============ */
function completedRuns(){return S.sessions.filter(s=>s.kind==='run'&&s.done!==false);}
// Nivel efectivo: avanza una semana por cada semana del calendario, pero se frena si la rodilla protestó
function levelFor(dateIso){
  let w=weekIndex(dateIso); if(w<0)w=0;
  let hold=0;
  completedRuns().filter(s=>s.date<dateIso).forEach(s=>{ if(s.repeat) hold++; });
  // hold frena la progresión: cada sesión marcada "repetir" retrasa medio nivel (dos sesiones = una semana)
  const lvl=Math.max(0,Math.min(PROG.length-1,w-Math.floor(hold/2)));
  return lvl;
}
function sessionFor(dateIso){
  const ov=S.override[dateIso]; if(ov==='rest') return {kind:'rest',title:'Descanso',date:dateIso};
  const dow=fromIso(dateIso).getDay(); // 0 dom
  if(dateIso<PLAN_START) return {kind:'rest',title:'Antes del plan',date:dateIso};
  const kind=ov||({1:'run',3:'run',5:'run',0:'run',6:'walk',2:'fuerza',4:'fuerza'})[dow];
  if(kind==='run'){
    const lvl=levelFor(dateIso);
    const lr=completedRuns().filter(s=>s.date<dateIso).sort((a,b)=>a.date<b.date?1:-1)[0];
    const kneeWeek=lr&&lr.repeat&&(fromIso(dateIso)-fromIso(lr.date))/864e5<=7;
    const segs=[{t:'walk',s:600,label:'Calentamiento'}];
    if(kneeWeek){
      const [reps,r,w]=INTERVALO_SUAVE;
      for(let i=0;i<reps;i++){segs.push({t:'run',s:r,label:'Trote '+(i+1)+'/'+reps});segs.push({t:'walk',s:w,label:'Andar'});}
      segs.push({t:'cool',s:300,label:'Vuelta a la calma'});
      return {kind,date:dateIso,level:lvl,kneeWeek:true,title:'Semana de rodilla: '+reps+' × '+fmtSeg(r)+' trote / '+fmtSeg(w)+' andar',segs,total:segs.reduce((a,b)=>a+b.s,0),runSecs:reps*r};
    }
    const r=PROG[lvl];
    segs.push({t:'run',s:r,label:'Carrera continua'});
    segs.push({t:'cool',s:300,label:'Vuelta a la calma'});
    return {kind,date:dateIso,level:lvl,title:'Carrera continua '+fmtMin(r)+' a 8:30–9:00',segs,total:segs.reduce((a,b)=>a+b.s,0),runSecs:r};
  }
  if(kind==='walk') return {kind,date:dateIso,title:'Caminata rápida 35 min',segs:[{t:'walk',s:2100,label:'Caminata'}],total:2100};
  if(kind==='fuerza') return {kind,date:dateIso,title:'Fuerza en casa · 10 min'};
  return {kind:'rest',title:'Descanso',date:dateIso};
}
function sessionsOn(dateIso){return S.sessions.filter(s=>s.date===dateIso);}
function isDone(dateIso){return sessionsOn(dateIso).length>0;}
function lastRun(){return completedRuns().sort((a,b)=>a.date<b.date?1:-1)[0];}
function kneeAdvice(){
  const lr=lastRun(); if(!lr||lr.kneeAfter==null) return null;
  const rhr=S.days[todayIso()]?.rhr; const base=baselineRHR();

function tick(){

function svgEl(t,a){const e=document.createElementNS('http://www.w3.org/2000/svg',t);for(const k in a)e.setAttribute(k,a[k]);return e;}
function chartWeeks(){
  const W=360,H=150,pl=30,pb=24,pt=10;
  const weeks=[];for(let w=0;w<WEEKS_SHOWN;w++){const mon=addDays(PLAN_START,w*7);const end=addDays(mon,6);const km=S.sessions.filter(s=>s.date>=mon&&s.date<=end).reduce((a,b)=>a+(b.dist||0),0);weeks.push({w,km,mon});}
  // la prueba del 1 nov cuenta en la semana 0 visualmente
  const pre=S.sessions.filter(s=>s.date<PLAN_START).reduce((a,b)=>a+(b.dist||0),0);weeks[0].km+=pre;
  const max=Math.max(5,...weeks.map(x=>x.km));const step=max>12?5:max>6?2:1;const top=Math.ceil(max/step)*step;
  const svg=svgEl('svg',{class:'chart',viewBox:`0 0 ${W} ${H}`});
  for(let y=0;y<=top;y+=step){const yy=pt+(H-pt-pb)*(1-y/top);svg.append(svgEl('line',{x1:pl,x2:W-6,y1:yy,y2:yy,class:'grid','stroke-width':1}));const t=svgEl('text',{x:pl-6,y:yy+4,'text-anchor':'end'});t.textContent=y;svg.append(t);}
  const bw=(W-pl-10)/weeks.length;
  weeks.forEach((x,i)=>{const h=(H-pt-pb)*(x.km/top);const bx=pl+i*bw+bw*.2;
    svg.append(svgEl('rect',{x:bx,y:H-pb-h,width:bw*.6,height:Math.max(0,h),rx:2,fill:weekIndex(todayIso())===i?'var(--accent)':'var(--walk)'}));
    const t=svgEl('text',{x:bx+bw*.3,y:H-8,'text-anchor':'middle'});t.textContent='S'+(i+1);svg.append(t);
    if(x.km>0){const tv=svgEl('text',{x:bx+bw*.3,y:H-pb-h-4,'text-anchor':'middle',style:'fill:var(--fg);font-weight:600'});tv.textContent=x.km.toFixed(1).replace('.',',');svg.append(tv);}});
  return svg;
}
function chartKnee(){

  const W=360,H=140,pl=26,pb=22,pt=10;
  const svg=svgEl('svg',{class:'chart',viewBox:`0 0 ${W} ${H}`});
  for(let y=0;y<=10;y+=2){const yy=pt+(H-pt-pb)*(1-y/10);svg.append(svgEl('line',{x1:pl,x2:W-6,y1:yy,y2:yy,class:'grid','stroke-width':1}));const t=svgEl('text',{x:pl-6,y:yy+4,'text-anchor':'end'});t.textContent=y;svg.append(t);}

    el('ul',{class:'small',style:'margin:0;padding-left:18px;color:var(--muted);display:flex;flex-direction:column;gap:4px'},
      el('li',{},'Carrera lunes, miércoles, viernes y domingo. Sábado caminata. Martes y jueves fuerza.'),
      el('li',{},'Si la rodilla acaba en 5 o más, o sube 2 puntos, la semana siguiente es de intervalos suaves (semana de rodilla).'),
      el('li',{},'Pulso en reposo 6 o más por encima de tu normal: día de andar o descansar.'),
      el('li',{},'Si bajas escaleras con molestia, no se corre ese día.'),
      el('li',{},'Rodilla hinchada, caliente, bloqueada o que cede: médico, no app.'))));
  return v;
}

/* ============ BOOT ============ */
document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>{if(R&&!R.finished){toast('Sesión en marcha. Termínala primero.');return;}go(b.dataset.v);}));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&R&&R.running)requestWake();});
// Al primer toque, prepara el audio para que la primera frase salga al instante
document.addEventListener('pointerdown',()=>{try{decodeAll();warmTTS();}catch(e){}},{once:true});
render();
</script>
